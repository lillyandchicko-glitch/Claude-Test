# Lädt Lillys Fotos von ImgBB herunter, verkleinert sie als WebP
# und legt sie in lilly/assets/img/ ab. Die Seite nutzt dann diese
# lokalen Bilder (schneller und unabhängig von ImgBB).
name: Lilly-Bilder holen

on:
  workflow_dispatch:
  push:
    paths:
      - "lilly/assets/js/data.js"
      - ".github/workflows/lilly-images.yml"

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick

      - name: Bilder laden und umwandeln
        run: |
          set -e
          mkdir -p lilly/assets/img
          # Alle i.ibb.co-Adressen aus data.js in Reihenfolge: zuerst cutout, dann photos
          grep -oE 'https://i\.ibb\.co/[^"]+' lilly/assets/js/data.js > urls.txt
          n=0
          while read -r url; do
            if [ "$n" -eq 0 ]; then out="lilly/assets/img/cutout.webp"; size=1400; else out=$(printf "lilly/assets/img/lilly-%02d.webp" "$n"); size=1000; fi
            echo "→ $url  ⇒  $out"
            curl -fsSL --retry 2 --max-time 40 -A "Mozilla/5.0" -o src.bin "$url" || { echo "::warning::Konnte $url nicht laden"; n=$((n+1)); continue; }
            # Ränder beschneiden (Freisteller, schwarze Balken); das Hero-Bild bleibt wie es ist
            trim=""; if [ "$n" -ge 1 ]; then trim="-fuzz 6% -trim +repage"; fi   # leere/schwarze Ränder weg
            convert "src.bin[0]" -auto-orient $trim -resize "${size}x${size}>" png:tmp.png
            cwebp -quiet -q 80 -alpha_q 90 tmp.png -o "$out"
            n=$((n+1))
          done < urls.txt
          rm -f src.bin tmp.png urls.txt
          ls -la lilly/assets/img

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lilly/assets/img
          if git diff --cached --quiet; then echo "Keine neuen Bilder."; exit 0; fi
          git commit -m "Lilly-Bilder als WebP ablegen"
          git push
